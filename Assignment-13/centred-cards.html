<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centred Cards</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .row { display: flex; justify-content: center; align-items: center; gap: 20px; height: 250px; background: #f1f1f1; }
    .card { background: white; border: 2px solid #333; border-radius: 10px; padding: 16px; width: 150px; text-align: center; }
  </style>
</head>
<body>
  <div class="row">
    <div class="card"><h3>Starter</h3><p>199</p></div>
    <div class="card"><h3>Standard</h3><p>349</p></div>
    <div class="card"><h3>Premium</h3><p>499</p></div>
  </div>
</body>
</html>
