<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid First</title>
  <style>
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .box { background: #cde; border: 1px solid #345; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    <div class="box">4</div><div class="box">5</div><div class="box">6</div>
  </div>
</body>
</html>
