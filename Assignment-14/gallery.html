<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
  <style>
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .box { background: #cde; border: 1px solid #345; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <h1>Club Photo Gallery</h1>
  <div class="gallery">
    <div class="box">Photo 1</div><div class="box">Photo 2</div><div class="box">Photo 3</div>
    <div class="box">Photo 4</div><div class="box">Photo 5</div><div class="box">Photo 6</div>
  </div>
</body>
