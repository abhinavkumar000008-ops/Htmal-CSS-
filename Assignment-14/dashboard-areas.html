<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Areas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    .dashboard {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      gap: 8px;
      min-height: 100vh;
    }
    .dashboard > div { padding: 16px; }
    .header  { grid-area: header;  background: #ffd6a5; }
    .sidebar { grid-area: sidebar; background: #caffbf; }
    .main    { grid-area: main;    background: #bde0fe; }
    .footer  { grid-area: footer;  background: #ffc6ff; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="main">Main</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>
