<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile First</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }
    .card { background: #e8f4ff; border: 2px solid #333; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    @media (min-width: 600px) {
      .cards { display: flex; gap: 16px; }
      .card { flex: 1; margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="cards">
    <div class="card"><h2>Card One</h2><p>On phones the cards stack.</p></div>
    <div class="card"><h2>Card Two</h2><p>At 600px and up they sit side by side.</p></div>
  </div>
</body>
</html>
