<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Text</title>
  <style>
    body { font-size: 1rem; font-family: Arial, sans-serif; }
    h1 { font-size: 1.5rem; }
    @media (min-width: 600px) {
      h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>Responsive Heading</h1>
  <p>Resize the window: at 600px wide or more the heading becomes larger.</p>
</body>
</html>
